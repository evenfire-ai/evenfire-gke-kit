# LLM-subscription proxy execution gate. The base default is "false" (the
# proxy workload runs but refuses execution). Flip to "true" only together with
# CONTROL_API_CODEX_SUBSCRIPTION_ENABLED / MCP_HOST_CODEX_SUBSCRIPTION_ENABLED
# and after Evenfire confirms the feature for your deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-llm-proxy-config
  namespace: control-plane
  labels:
    app: codex-llm-proxy
data:
  CODEX_LLM_PROXY_EXECUTION_ENABLED: "false"
