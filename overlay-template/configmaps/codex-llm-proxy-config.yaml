# Codex subscription execution gate. The template enables the Control API,
# proxy and Host gates together; a connected account is still required.
apiVersion: v1
kind: ConfigMap
metadata:
  name: codex-llm-proxy-config
  namespace: control-plane
  labels:
    app: codex-llm-proxy
data:
  CODEX_LLM_PROXY_EXECUTION_ENABLED: "true"
