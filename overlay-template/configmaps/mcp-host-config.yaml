# Runtime configuration for every HCC-managed mcp-host (agent) pod. Not in
# base; the overlay ships it in full. The JWT public key is deliberately empty:
# the auth-key sync step copies the live rpc-proxy public key into
# CLERUM_AUTH_JWT_PUBLIC_KEY after every apply (see ../07-deploy-sequence-and-verification.md).
# Do not paste a key here — every apply would overwrite it anyway.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-host-config
  namespace: mcp-host
  labels:
    app: mcp-host
data:
  CLERUM_HOST_NAME: "chatllm"
  CLERUM_SERVER_PORT: "8080"
  CLERUM_CONTEXT_MAPPER_URL: "http://host-context-controller-api-gateway.control-plane.svc.cluster.local:8081"
  CLERUM_CONTEXT_MAPPER_POLL_INTERVAL: "30000"
  MCP_PROXY_ENABLED: "false"
  MCP_PROXY_URL: "http://mcp-proxy.mcp-server.svc.cluster.local:8083"
  # Codex Host execution gate; align with Control API and the Codex proxy.
  MCP_HOST_CODEX_SUBSCRIPTION_ENABLED: "true"
  # HCC injects MCP_HOST_GROK_SUBSCRIPTION_ENABLED per eligible Grok Host;
  # leave it out of this shared ConfigMap.
  CODEX_TOOL_PRESENTATION: "auto"
  CLERUM_NATIVE_TOOL_PRESENTATION: "auto"
  CLERUM_AGENT_TASK_DELAY: "3"
  CLERUM_AGENT_MAX_TASK_DURATION: "86400000"
  # Keep the per-task tool-call budget bounded even for long-running tasks.
  CLERUM_AGENT_MAX_TOOL_CALLS: "100"
  CLERUM_SHELL_TIMEOUT: "600000"
  CLERUM_TOOL_TIMEOUT: "660000"
  CLERUM_MCP_TOOL_TIMEOUT_MS: "3600000"
  CLERUM_MCP_TOOL_MAX_TOTAL_TIMEOUT_MS: "3600000"
  CLERUM_AGENT_MAX_QUEUE_SIZE: "100"
  CLERUM_BUDGETS_ENABLED: "true"
  CLERUM_APPROVAL_CONFIG: '{"defaultPolicy":"channel_users","channels":{"telegram":{"enabled":true}}}'
  CLERUM_APPROVAL_TIMEOUT: "0"
  CLERUM_MEMORY_ENABLED: "true"
  CLERUM_SESSION_STORE: "sqlite"
  CLERUM_SESSION_SEARCH_ENABLED: "true"
  CLERUM_SESSION_TTL_DAYS: "90"
  CLERUM_SEARCH_RETENTION_DAYS: "90"
  CLERUM_CONTEXT_MAX_TOKENS: "100000"
  CLERUM_ENABLE_RESPONSE_ATTACHMENTS: "true"
  CLERUM_ATTACHMENT_MAX_COUNT: "3"
  CLERUM_ATTACHMENT_MAX_BYTES: "52428800"
  CLERUM_PERSONALIZATION_ENABLED: "false"
  # Runtime auth between channel-reader/rpc-proxy and mcp-host. Keep true.
  CLERUM_ENABLE_AUTH: "true"
  CLERUM_AUTH_JWT_ISSUER: "control-api"
  CLERUM_AUTH_JWT_AUDIENCE: "rpc-proxy"
  # Populated at deploy time by the auth-key sync (RPC public key). Leave empty.
  CLERUM_AUTH_JWT_PUBLIC_KEY: ""
